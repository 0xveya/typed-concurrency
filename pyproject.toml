[project]
name = "typed-concurrency"
version = "0.0.0"
description = "Typed structured concurrency with Go-ish ergonomics for asyncio"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Veya Fürst", email = "ghgstefan@gmail.com" }]
keywords = ["asyncio", "concurrency", "structured-concurrency", "typing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = ["typed-errs>=0,<1"]

[project.urls]
PyPI = "https://pypi.org/project/typed-concurrency/"
Repository = "https://github.com/0xveya/typed-concurrency"
Issues = "https://github.com/0xveya/typed-concurrency/issues"

[dependency-groups]
dev = ["basedpyright", "mypy", "pytest", "ruff"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
typed_concurrency = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
